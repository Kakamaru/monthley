# Pangkalan data UJIAN — berasingan daripada monthley_new yang backend guna.
#
# Bukan environment baharu: DB kedua pada MySQL yang sama, mesin yang sama.
# Sebabnya ujian dan backend berkongsi jadual: ujian @Transactional menulis
# dan roll back, tetapi ia memegang kunci baris sepanjang transaksi. Backend
# yang hidup dan membaca jadual sama akan menunggu, kadang timeout.
#
# Gejalanya mengelirukan: konteks Spring gagal naik dengan
# "Unable to determine Dialect without JDBC metadata" — bunyinya seperti
# masalah konfigurasi, sebenarnya Hibernate tidak dapat satu sambungan pun.
# Disahkan 26 Julai 2026: mematikan backend menjadikan ujian lulus
# serta-merta.
#
# AMARAN, 30 Julai 2026: mesej yang SAMA muncul untuk punca yang sama
# sekali berbeza — SQL rosak dalam @BeforeEach. Satu INSERT ujian
# menamakan enam lajur yang tidak wujud, dan Spring melaporkannya sebagai
# kegagalan permulaan.
#
# Empat teori disiasat sebelum puncanya ditemui (kebenaran MySQL, kolam
# sambungan, checksum Flyway, lajur VIEW). Semuanya boleh dielakkan
# dengan membaca 'Caused by' dahulu:
#
#     mvn test -Dtest=X 2>&1 | grep -A3 "Caused by"
#
# 'Unable to determine Dialect' bermakna Hibernate tidak mendapat
# sambungan yang berguna. SEBABNYA ada di bawahnya, bukan dalam mesej
# itu.
#
# Cipta semula bila-bila masa:
#     ./mb testdb
#
spring:
  datasource:
    url: jdbc:mysql://localhost:3307/monthley_test?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Kuala_Lumpur
    username: monthley
    password: devpass
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      # validate, sama seperti dev. Flyway membina skema; Hibernate
      # mengesahkan setiap entity padan dengannya. Sebelum 31 Julai 2026
      # ini `none` dan guard 1 tidak pernah hidup dalam ujian.
      ddl-auto: validate
  flyway:
    # Flyway membina skema ujian, sama seperti dev dan prod.
    #
    # Sebelum 31 Julai 2026 ini `false`, dan ./mb testdb menjalankan
    # setiap fail SQL dengan tangan lalu menyisip sejarah checksum NULL.
    # Kesannya: `mvn test` hijau lawan skema yang tiada siapa sahkan
    # datang dari migrasi. Rujuk cara-kerja.md sec 2.
    enabled: true
