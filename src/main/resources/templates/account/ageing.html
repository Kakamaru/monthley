<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8"/>
<!--
  Ageing — bucket SEBENAR, bukan kumulatif.

  Jumlah keenam-enam lajur sama dengan Jumlah, setiap baris. Laporan
  legacy mengulang nombor merentas lajur dan menghasilkan bucket yang
  MELEBIHI jumlah keseluruhan.

  KETAT: XHTML. Tiada entiti bernama; th:text sentiasa.
-->
<style>
@page { size: A4 landscape; margin: 12mm 10mm 14mm 10mm;
        @bottom-left { content: element(kakiKiri); }
        @bottom-right { content: element(kakiKanan); } }
/* 10pt, bukan 9pt: laporan ini penuh nombor dan dibaca merentas tujuh
   lajur. Saiz kecil menjadikan mata mencari, bukan membaca. */
body { font-family: 'Monthley', 'DejaVu Sans', sans-serif; font-size: 10pt;
       color: #111; }

.hdr { width: 100%; } .hdr td { vertical-align: top; }
.sp-name { font-size: 14pt; font-weight: bold; line-height: 1.15; }
.sp-detail { font-size: 8pt; color: #444; line-height: 1.35; }
.tajuk { font-size: 13pt; font-weight: bold; text-align: right; line-height: 1.3; }

table.data    { border-collapse: collapse; width: 100%; margin-top: 6mm; }
table.data th { background: #ddd; border: 0.5pt solid #999; padding: 1.6mm 1.2mm;
                font-size: 8pt; }
table.data td { border: 0.4pt solid #ccc; padding: 1.8mm 1.4mm; }
table.data tr { page-break-inside: avoid; }

.r { text-align: right; } .c { text-align: center; }
/* Sifar dipudarkan supaya mata mencari nombor yang BUKAN sifar —
   tetapi #bbb terlalu ringan untuk dicetak. */
.kosong { color: #888; }

.jumlah td { background: #eee; font-weight: bold; border-top: 0.8pt solid #555; }

#kakiKiri  { position: running(kakiKiri);  font-size: 8pt; color: #555; }
#kakiKanan { position: running(kakiKanan); font-size: 8pt; color: #555;
             text-align: right; }
.pg:before { content: counter(page); } .tot:before { content: counter(pages); }
</style>
</head>
<body>

<div id="kakiKiri">Tarikh Cetak: <span th:text="${fmt.date(#temporals.createToday())}"></span></div>
<div id="kakiKanan">Muka <span class="pg"></span> daripada <span class="tot"></span></div>

<table class="hdr">
  <tr>
    <td style="width:60%">
      <div class="sp-name" th:text="${h.spName()}">SP</div>
      <div class="sp-detail">
        <span th:if="${fmt.has(h.spAddrLine1())}" th:text="${h.spAddrLine1()} + ', '"></span>
        <span th:if="${fmt.has(h.spPostcode())}"  th:text="${h.spPostcode()} + ' '"></span>
        <span th:if="${fmt.has(h.spCity())}"      th:text="${h.spCity()} + ', '"></span>
        <span th:if="${fmt.has(h.spState())}"     th:text="${h.spState()}"></span>
      </div>
    </td>
    <td class="tajuk">
      LAPORAN AGEING<br/>
      <span th:text="'PADA ' + ${fmt.date(r.asAt())}"></span>
    </td>
  </tr>
</table>

<table class="data">
  <thead>
    <tr>
      <th style="width:4%">No.</th>
      <th style="width:12%">No. Akaun</th>
      <th>Nama</th>
      <th style="width:10%" class="r">Jumlah</th>
      <th style="width:10%" class="r">Belum Matang</th>
      <th style="width:9%" class="r">0-30</th>
      <th style="width:9%" class="r">31-60</th>
      <th style="width:9%" class="r">61-90</th>
      <th style="width:9%" class="r">91-180</th>
      <th style="width:9%" class="r">180+</th>
    </tr>
  </thead>
  <tbody>
    <tr th:each="a,i : ${r.rows()}">
      <td class="c" th:text="${i.count}">1</td>
      <td th:text="${a.accountNo()}"></td>
      <td th:text="${a.accountName()}"></td>
      <td class="r" style="font-weight:bold" th:text="${fmt.money(a.total())}"></td>
      <!-- Sifar dipudarkan: mata mencari nombor yang BUKAN sifar, dan
           lajur penuh dengan 0.00 menyembunyikannya. -->
      <td class="r" th:classappend="${a.notDue().signum() == 0} ? 'kosong'"
          th:text="${fmt.money(a.notDue())}"></td>
      <td class="r" th:classappend="${a.d30().signum() == 0} ? 'kosong'"
          th:text="${fmt.money(a.d30())}"></td>
      <td class="r" th:classappend="${a.d60().signum() == 0} ? 'kosong'"
          th:text="${fmt.money(a.d60())}"></td>
      <td class="r" th:classappend="${a.d90().signum() == 0} ? 'kosong'"
          th:text="${fmt.money(a.d90())}"></td>
      <td class="r" th:classappend="${a.d180().signum() == 0} ? 'kosong'"
          th:text="${fmt.money(a.d180())}"></td>
      <td class="r" th:classappend="${a.over180().signum() == 0} ? 'kosong'"
          th:text="${fmt.money(a.over180())}"></td>
    </tr>
    <tr class="jumlah">
      <td colspan="3" class="r">Jumlah</td>
      <td class="r" th:text="${fmt.money(r.total())}"></td>
      <td class="r" th:text="${fmt.money(r.notDue())}"></td>
      <td class="r" th:text="${fmt.money(r.d30())}"></td>
      <td class="r" th:text="${fmt.money(r.d60())}"></td>
      <td class="r" th:text="${fmt.money(r.d90())}"></td>
      <td class="r" th:text="${fmt.money(r.d180())}"></td>
      <td class="r" th:text="${fmt.money(r.over180())}"></td>
    </tr>
  </tbody>
</table>

</body>
</html>
