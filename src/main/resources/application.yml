spring:
  application:
    name: monthley

  jpa:
    hibernate:
      # 'validate': Hibernate semak setiap entity lawan skema semasa boot.
      # Entity yang sebut lajur tak wujud -> boot GAGAL, bukan senyap sampai
      # ujian. Menangkap kelas bug 'entity menyimpang dari skema' (cth
      # Product.generationDay selepas V17). Flyway tetap memiliki skema —
      # validate hanya menyemak, tidak mengubah.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: Asia/Kuala_Lumpur
        # Envers — audit trail untuk data kewangan
        integration.envers.enabled: false
        org.hibernate.envers.audit_table_suffix: _aud

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  modulith:
    events:
      # false: Modulith membaca event_publication semasa startup, SEBELUM
      # Flyway sempat menciptanya -> boot gagal atas DB kosong. Ia "berjaya"
      # sebelum ini hanya kerana table sudah wujud dari larian terdahulu.
      # Kita tidak menggunakan event Modulith buat masa ini (tiada
      # @ApplicationModuleListener / publishEvent dalam kod). Hidupkan semula
      # bila event digunakan DAN turutan bean diselesaikan.
      republish-outstanding-events-on-restart: false
      completion-mode: update   # simpan rekod selesai untuk audit

server:
  port: 8080

logging:
  level:
    com.monthley: INFO


# ====================== MONTHLEY ======================
monthley:
  app-url: ${MONTHLEY_APP_URL:http://localhost:4200}

  # Asal-usul CORS, dipisah koma. Pelayar menghantar Origin; curl tidak —
  # jadi CORS yang salah kelihatan seperti masalah pengesahan.
  cors:
    origins: ${MONTHLEY_CORS_ORIGINS:http://localhost:4200}
  secret:
    # Kunci induk AES-256 untuk kelayakan gerbang (base64, 32 bait).
    # Jana: openssl rand -base64 32
    # PENGELUARAN: tetapkan MONTHLEY_MASTER_KEY — lalai di bawah untuk
    # pembangunan sahaja, dan menukarnya menjadikan kunci sedia ada tidak
    # boleh dibaca.
    master-key: ${MONTHLEY_MASTER_KEY:wANY2glLQzwg5dHr/HQIYjhl6LcDR7OhIKii2H9Hf7M=}

  gateway:
    toyyibpay:
      # Sandbox dan pengeluaran ialah HOST berbeza dengan kunci berbeza.
      # Bendera sandbox pada sp_payment_setting menentukan mana digunakan.
      sandbox-url: ${TOYYIBPAY_SANDBOX_URL:https://dev.toyyibpay.com}
      live-url: ${TOYYIBPAY_LIVE_URL:https://toyyibpay.com}

  jwt:
    secret: ${MONTHLEY_JWT_SECRET:monthley-dev-secret-key-change-in-production-min-32-chars}
    ttl-hours: 12
  email:
    # Kunci Resend — dari env sahaja. JANGAN commit kunci sebenar.
    resend-key: ${MONTHLEY_RESEND_KEY:}
    from: ${MONTHLEY_EMAIL_FROM:Monthley <onboarding@resend.dev>}

---
# ====================== DEV (MySQL 9 local) ======================
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:mysql://127.0.0.1:3307/monthley_new?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Kuala_Lumpur
    username: monthley
    password: devpass
    driver-class-name: com.mysql.cj.jdbc.Driver

logging:
  level:
    com.monthley: DEBUG
    org.hibernate.SQL: DEBUG

---
# ====================== PROD (MariaDB) ======================
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    # Pemacu MySQL, bukan MariaDB — pembangunan dan ujian berjalan pada
    # MySQL, dan pemacu berbeza mempunyai perbezaan halus dalam
    # pengendalian jenis dan zon masa. Menggunakan pemacu lain di
    # pengeluaran bermakna perbezaan itu hanya muncul di sana.
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Kuala_Lumpur
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
